# ==============================================================================
# Projeto: Brazilian RPS Sim (Sistema de Posicionamento e Aumento Brasileiro)
# Arquivo: simulation_parameters.yaml
# Descrição: Configurações declarativas centrais para simulação, astrodinâmica,
#            mecânica celeste, constelação completa de 7 satélites (3 GEO + 4 IGSO).
# ==============================================================================

# ⏱️ 1. Configurações Globais de Simulação e Tempo
simulation:
  use_sim_time: true
  time_multiplier: 3600.0         # 1s na vida real = 1 hora orbital (3.600x)
  render_scale: 0.001             # 1 unidade no Gazebo = 1.000 km reais
  telemetry_rate_hz: 1.0          # Frequência de publicação ROS 2 (Hz)
  physics_frequency_hz: 60.0      # Frequência do motor de física / quadros (Hz)

# 🎨 2. Visualização, Marcadores e Linhas de Trajetória (100% Modulares e com Paleta de Cores)
# Paleta pré-determinada disponível:
# 'cyan', 'amber', 'gold', 'neon_green', 'electric_blue', 'magenta', 'orange', 'purple', 'red', 'white'
visualization:
  # ============================================================================
  # 🌌 A) Linhas e Trilhas de Órbita no Espaço (Orbit Trails / Trajetórias 3D)
  # ============================================================================
  orbit_trails:
    show_earth_orbit: true        # Linha da órbita da Terra ao redor do Sol
    show_moon_orbit: true         # Linha da órbita da Lua ao redor da Terra
    show_geo_orbit: true          # Anel circular equatorial dos satélites GEO
    show_igso_orbit: true         # Trajetória 3D da Figura-8 dos satélites IGSO
    
    # Cores das Linhas Orbitais (Paleta amigável ou [r, g, b])
    color_earth_orbit: "gold"     # Amarelo/Dourado solar
    color_moon_orbit: "white"     # Branco lunar
    color_geo_orbit: "cyan"       # Ciano neon
    color_igso_orbit: "amber"     # Âmbar/Dourado neon
    
    # Espessura dos tubos orbitais (unidades do mundo)
    tube_thickness_earth: 0.80    # Espessura da linha heliocêntrica
    tube_thickness_moon: 0.35     # Espessura da linha lunar
    tube_thickness_geo: 0.10      # Espessura do anel GEO
    tube_thickness_igso: 0.12     # Espessura do tubo da Figura-8 IGSO

  # ============================================================================
  # 🛰️ B) Marcadores de Satélite (Halos Holográficos e Feixes de Cobertura Nadir)
  # ============================================================================
  satellite_markers:
    # --- Configurações Gerais dos Marcadores ---
    nadir_beam_style: "holographic_cage" # Opções: "holographic_cage" (Padrão STK/NASA), "solid_cone"
    nadir_cone_top_radius: 0.08          # Diâmetro no topo (escala da antena do satélite)
    beacon_radius: 0.35                  # Raio do anel holográfico de mira
    beacon_tube_thickness: 0.015         # Espessura do anel holográfico de mira
    satellite_visual_scale: 0.08         # Escala visual do satélite 3D (1.0 = real)

    # --------------------------------------------------------------------------
    # 📡 1. Marcadores dos Satélites Geoestacionários (GEO)
    # --------------------------------------------------------------------------
    geo_markers:
      show_beacon_halo: true             # Halo holográfico ao redor do satélite
      show_nadir_beam: true              # Projeção Nadir geral
      show_boresight_ray: true           # Raio laser central interno (sub-satélite)
      show_generatrix_rays: true         # Feixes de borda / gaiola externa
      num_generatrix_rays: 4             # Quantidade de raios geratrizes (0 a 16; 0 = apenas raio central)
      show_footprint_ring: true          # Anel de pegada no solo (~4.800 km)
      show_mid_altitude_ring: false      # Anel intermediário de altitude
      show_footprint_crosshair: true     # Mira de alvo no ponto sub-satélite
      footprint_radius_km: 4800.0        # Raio no solo em km (4.80 unidades)
      ray_thickness: 0.016               # Espessura dos tubos laser
      color: "cyan"                      # Cor do feixe GEO (Ciano Espacial)
      emissive_intensity: 0.85           # Brilho neon emissivo (0.0 a 1.0)
      beacon_emissive: 0.80              # Brilho do halo GEO

    # --------------------------------------------------------------------------
    # 🛰️ 2. Marcadores dos Satélites Geossíncronos Inclinados (IGSO)
    # --------------------------------------------------------------------------
    igso_markers:
      show_beacon_halo: true             # Halo holográfico ao redor do satélite
      show_nadir_beam: true              # Projeção Nadir geral
      show_boresight_ray: true           # Raio laser central interno (sub-satélite)
      show_generatrix_rays: true         # Feixes de borda / gaiola externa
      num_generatrix_rays: 4             # Quantidade de raios geratrizes (0 a 16; 0 = apenas raio central)
      show_footprint_ring: true          # Anel de pegada no solo (~1.150 km)
      show_mid_altitude_ring: false      # Anel intermediário de altitude
      show_footprint_crosshair: true     # Mira de alvo no ponto sub-satélite
      footprint_radius_km: 1150.0        # Raio no solo em km (1.15 unidades)
      ray_thickness: 0.018               # Espessura dos tubos laser
      color: "amber"                     # Cor do feixe IGSO (Âmbar/Dourado Neon)
      emissive_intensity: 0.95           # Brilho neon emissivo (0.0 a 1.0)
      beacon_emissive: 0.85              # Brilho do halo IGSO

# 🌌 3. Mecânica Celeste e Corpos Astronômicos
celestial_mechanics:
  sun:
    radius_render: 45.0
    radius_real_km: 696340.0
  earth:
    radius_km: 6378.137
    obliquity_deg: 23.43928
    dist_sun_render: 1200.0
    clouds_drift_factor: 1.035
    sidereal_day_sec: 86164.0905
    sidereal_year_sec: 31558149.76 # 365.256363 dias
  moon:
    radius_km: 1737.4
    inclination_deg: 5.145
    dist_earth_render: 384.4
    sidereal_month_sec: 2360591.51 # 27.321661 dias
    synodic_month_sec: 2551442.89  # 29.530589 dias

# 🛰️ 4. Constelação Completa RPS-BR: 7 Satélites (3 GEO + 4 IGSO)
constellation:
  mu_earth: 398600.4418           # km^3 / s^2
  j2_perturbation: 1.08263e-3
  flattening: 0.00335281          # 1 / 298.257223563
  satellites:
    # ==========================================================================
    # 📡 SEGMENTO GEO (3 Satélites Geoestacionários ao Longo do Equador)
    # ==========================================================================
    - id: 1
      name: "RPS-GEO-1 (Norte/Manaus)"
      type: "GEO"
      semi_major_axis_km: 42164.14
      eccentricity: 0.0
      inclination_deg: 0.0
      raan_deg: 0.0
      arg_perigee_deg: 0.0
      mean_anomaly_deg: 300.0     # 60.0° W (Manaus / Amazônia Central)
      station_longitude_deg: -60.0

    - id: 2
      name: "RPS-GEO-2 (Centro/BSB)"
      type: "GEO"
      semi_major_axis_km: 42164.14
      eccentricity: 0.0
      inclination_deg: 0.0
      raan_deg: 0.0
      arg_perigee_deg: 0.0
      mean_anomaly_deg: 312.0     # 48.0° W (Brasília / Centro-Oeste)
      station_longitude_deg: -48.0

    - id: 3
      name: "RPS-GEO-3 (Leste/Costa)"
      type: "GEO"
      semi_major_axis_km: 42164.14
      eccentricity: 0.0
      inclination_deg: 0.0
      raan_deg: 0.0
      arg_perigee_deg: 0.0
      mean_anomaly_deg: 324.0     # 36.0° W (Nordeste / Sudeste / Costa Leste)
      station_longitude_deg: -36.0

    # ==========================================================================
    # 🛰️ SEGMENTO IGSO (4 Satélites Geossíncronos em Figura-8 com Apogeu no Sul)
    # ==========================================================================
    - id: 4
      name: "RPS-IGSO-1 (Sul/Apogeu)"
      type: "IGSO"
      semi_major_axis_km: 42164.14
      eccentricity: 0.040
      inclination_deg: 25.0
      raan_deg: 42.0
      arg_perigee_deg: 90.0
      mean_anomaly_deg: 180.0     # Apogeu no Sul

    - id: 5
      name: "RPS-IGSO-2 (Descida Sul)"
      type: "IGSO"
      semi_major_axis_km: 42164.14
      eccentricity: 0.040
      inclination_deg: 25.0
      raan_deg: 312.0
      arg_perigee_deg: 90.0
      mean_anomaly_deg: 270.0

    - id: 6
      name: "RPS-IGSO-3 (Norte/Perigeu)"
      type: "IGSO"
      semi_major_axis_km: 42164.14
      eccentricity: 0.040
      inclination_deg: 25.0
      raan_deg: 222.0
      arg_perigee_deg: 90.0
      mean_anomaly_deg: 0.0       # Perigeu no Norte

    - id: 7
      name: "RPS-IGSO-4 (Subida Norte)"
      type: "IGSO"
      semi_major_axis_km: 42164.14
      eccentricity: 0.040
      inclination_deg: 25.0
      raan_deg: 132.0
      arg_perigee_deg: 90.0
      mean_anomaly_deg: 90.0
