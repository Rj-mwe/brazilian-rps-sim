# ==============================================================================
# Projeto: Brazilian RPS Sim (Sistema de Posicionamento e Aumento Brasileiro)
# Arquivo: simulation_parameters.yaml
# Descrição: Configurações declarativas centrais para simulação, astrodinâmica,
#            mecânica celeste, constelação dinâmica e marcadores visuais 3D.
# ==============================================================================

# ⏱️ 1. Configurações Globais de Simulação e Tempo
simulation:
  use_sim_time: true
  time_multiplier: 3600.0         # 1s na vida real = 1 hora orbital (3.600x)
  render_scale: 0.001             # 1 unidade no Gazebo = 1.000 km reais
  telemetry_rate_hz: 1.0          # Frequência de publicação ROS 2 (Hz)
  physics_frequency_hz: 60.0      # Frequência do motor de física / quadros (Hz)

# 🎨 2. Configurações Declarativas de Marcadores Visuais (100% Customizáveis)
visualization:
  markers:
    # --- Chaves de Ativação Geral ---
    show_beacon_halo: true          # Retículos/anéis de mira holográficos neon
    show_nadir_cone: true           # Feixes/cones de cobertura Nadir sobre a Terra
    show_orbital_ring: true         # Anéis 3D da trajetória orbital no vácuo
    
    # --- Parâmetros dos Retículos / Halos ---
    beacon_radius: 0.35             # Raio do anel de mira (unidades do mundo)
    beacon_tube_thickness: 0.015    # Espessura do anel holográfico
    beacon_emissive_intensity: 0.70 # Brilho emissivo neon suave (0.0 a 1.0)
    
    # --- Parâmetros dos Feixes / Cones Nadir (Ultratranslúcidos e discretos) ---
    nadir_cone_opacity: 0.15        # Opacidade ultratranslúcida e suave
    nadir_cone_top_radius: 0.08     # Diâmetro no topo (escala exata da antena do satélite)
    nadir_cone_bottom_radius: 1.35  # Raio de cobertura no solo (~1.350 km)
    nadir_cone_emissive_intensity: 0.20 # Brilho emissivo suave e elegante
    
    # --- Escala Visual do Satélite 3D ---
    satellite_visual_scale: 0.08    # Escala visual do satélite (1.0 = real)

# 🌌 3. Mecânica Celeste e Corpos Astronômicos
celestial_mechanics:
  sun:
    radius_render: 45.0
    radius_real_km: 696340.0
  earth:
    radius_km: 6378.137
    obliquity_deg: 23.43928
    dist_sun_render: 1200.0
    clouds_drift_factor: 1.035
    sidereal_day_sec: 86164.0905
    sidereal_year_sec: 31558149.76 # 365.256363 dias
  moon:
    radius_km: 1737.4
    inclination_deg: 5.145
    dist_earth_render: 384.4
    sidereal_month_sec: 2360591.51 # 27.321661 dias
    synodic_month_sec: 2551442.89  # 29.530589 dias

# 🛰️ 4. Constelação RPS-BR: Trinca de Satélites Geoestacionários Calibrados
constellation:
  mu_earth: 398600.4418           # km^3 / s^2
  j2_perturbation: 1.08263e-3
  flattening: 0.00335281          # 1 / 298.257223563
  satellites:
    # --- GEO 1: Cobertura Norte / Amazônia Central (60.0° W - Manaus) ---
    - id: 1
      name: "RPS-GEO-1 (Norte/Manaus)"
      type: "GEO"
      semi_major_axis_km: 42164.14
      eccentricity: 0.0
      inclination_deg: 0.0
      raan_deg: 0.0
      arg_perigee_deg: 0.0
      mean_anomaly_deg: 300.0     # 60.0° W (Manaus / Amazônia Central)
      station_longitude_deg: -60.0

    # --- GEO 2: Cobertura Centro-Oeste / Brasília (48.0° W) ---
    - id: 2
      name: "RPS-GEO-2 (Centro/BSB)"
      type: "GEO"
      semi_major_axis_km: 42164.14
      eccentricity: 0.0
      inclination_deg: 0.0
      raan_deg: 0.0
      arg_perigee_deg: 0.0
      mean_anomaly_deg: 312.0     # 48.0° W (Brasília / Centro-Oeste)
      station_longitude_deg: -48.0

    # --- GEO 3: Cobertura Leste / Nordeste / Sudeste (36.0° W) ---
    - id: 3
      name: "RPS-GEO-3 (Leste/Costa)"
      type: "GEO"
      semi_major_axis_km: 42164.14
      eccentricity: 0.0
      inclination_deg: 0.0
      raan_deg: 0.0
      arg_perigee_deg: 0.0
      mean_anomaly_deg: 324.0     # 36.0° W (Nordeste / Sudeste / Costa Leste)
      station_longitude_deg: -36.0
