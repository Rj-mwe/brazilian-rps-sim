<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPS-BR // Visualizador Geoespacial 3D (CesiumJS)</title>
  
  <!-- Configuração do Base URL DEVE preceder a inclusão do script Cesium.js -->
  <script>
    window.CESIUM_BASE_URL = "https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/";
  </script>

  <!-- CesiumJS CSS & Script -->
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    /* Estilização da barra de animação do Cesium */
    .cesium-viewer-animationContainer, .cesium-viewer-timelineContainer {
      display: block !important;
    }
    .cesium-timeline-main {
      border-top: 1px solid rgba(51, 65, 85, 0.6) !important;
      background: rgba(15, 23, 42, 0.85) !important;
    }
  </style>
</head>
<body class="h-full font-sans text-slate-200 antialiased select-none">

  <!-- Container Principal 3D -->
  <div id="cesiumContainer"></div>

  <!-- HUD Flutuante Superior -->
  <div class="absolute top-4 left-4 z-50 bg-slate-900/90 backdrop-blur-md border border-slate-700/60 p-3.5 rounded-2xl shadow-2xl flex items-center space-x-4">
    <div class="flex items-center space-x-2.5">
      <span class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></span>
      <div>
        <h1 class="text-xs font-bold tracking-wider text-white uppercase">RPS-BR // 3D Orbit Globe</h1>
        <p class="text-[10px] text-slate-400 font-mono">CesiumJS WGS84 • 3 GEO + 4 IGSO</p>
      </div>
    </div>
    <div class="h-6 w-px bg-slate-800"></div>
    <div class="flex items-center space-x-1.5 text-xs font-mono">
      <button onclick="focusBrazil()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-300 font-semibold transition border border-slate-700">🇧🇷 Focar Brasil</button>
      <button onclick="focusConstellation()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-300 font-semibold transition border border-slate-700">🛰️ Constelação</button>
      <button onclick="toggleOrbits()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition border border-slate-700">Linhas</button>
      <a href="/" target="_blank" class="px-2.5 py-1 rounded-lg bg-cyan-950/80 hover:bg-cyan-900 text-cyan-300 font-semibold transition border border-cyan-800/60 flex items-center space-x-1">
        <span>Painel Telemetria</span>
        <span>↗</span>
      </a>
    </div>
    <div class="h-6 w-px bg-slate-800"></div>
    <div class="flex items-center space-x-2 text-xs font-mono">
      <div class="flex items-center space-x-1 px-2.5 py-1 rounded-lg bg-slate-800/80 border border-slate-700/80">
        <span class="text-slate-400">Tempo:</span>
        <span id="cesium-time-text" class="text-white font-bold">00:00:00</span>
      </div>
      <div id="cesium-status-badge" class="px-2 py-1 rounded-lg bg-emerald-950/80 text-emerald-300 font-bold border border-emerald-800/60 flex items-center space-x-1">
        <span id="cesium-status-indicator" class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="cesium-status-text">SINCRONIZANDO</span>
      </div>
    </div>
  </div>

  <!-- Script de Inicialização da Cena 3D -->
  <script>
    let viewer = null;
    let czmlSource = null;
    let showPaths = true;
    let lastTelemetryState = null;
    const simulationEpoch = Cesium.JulianDate.fromIso8601("2026-09-09T00:00:00Z");

    function syncCesiumClock(simTimeSec, isPaused, multiplier, mode) {
      if (!viewer || viewer.isDestroyed()) return;

      const targetJulian = Cesium.JulianDate.addSeconds(simulationEpoch, simTimeSec, new Cesium.JulianDate());

      // 1. Atualiza HUD
      const timeEl = document.getElementById('cesium-time-text');
      if (timeEl) {
        const hours = Math.floor(simTimeSec / 3600);
        const mins = Math.floor((simTimeSec % 3600) / 60);
        const secs = Math.floor(simTimeSec % 60);
        timeEl.innerText = `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      const statusBadge = document.getElementById('cesium-status-badge');
      const statusInd = document.getElementById('cesium-status-indicator');
      const statusText = document.getElementById('cesium-status-text');

      // 2. Controla o relógio interno do Cesium
      if (isPaused) {
        viewer.clock.shouldAnimate = false;
        viewer.clock.currentTime = targetJulian;

        if (statusBadge) statusBadge.className = "px-2 py-1 rounded-lg bg-rose-950/80 text-rose-300 font-bold border border-rose-800/60 flex items-center space-x-1";
        if (statusInd) statusInd.className = "w-2 h-2 rounded-full bg-rose-400";
        if (statusText) statusText.innerText = mode === 'MASTER_GAZEBO' ? '⏸️ GAZEBO PAUSADO' : '⏸️ PAUSADO';
      } else {
        viewer.clock.multiplier = multiplier || 3600.0;
        viewer.clock.shouldAnimate = true;

        // Correção de deriva entre o relógio Cesium e o Core
        const currentClockTime = viewer.clock.currentTime;
        const diffSec = Math.abs(Cesium.JulianDate.secondsDifference(currentClockTime, targetJulian));
        if (diffSec > 1.5) {
          viewer.clock.currentTime = targetJulian;
        }

        if (statusBadge) statusBadge.className = "px-2 py-1 rounded-lg bg-emerald-950/80 text-emerald-300 font-bold border border-emerald-800/60 flex items-center space-x-1";
        if (statusInd) statusInd.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
        if (statusText) statusText.innerText = `${multiplier || 3600}x ${mode === 'MASTER_GAZEBO' ? '(GAZEBO)' : '(CORE)'}`;
      }
    }

    function connectTelemetryWs() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const host = window.location.host || 'localhost:8000';
      const wsUrl = `${protocol}//${host}/ws/telemetry`;

      let ws = null;
      try {
        ws = new WebSocket(wsUrl);
      } catch (e) {
        console.warn("Aviso ao conectar WS de telemetria no Cesium:", e);
        return;
      }

      ws.onmessage = (event) => {
        try {
          const payload = JSON.parse(event.data);
          if (payload && payload.simulation) {
            lastTelemetryState = payload.simulation;
            syncCesiumClock(
              payload.simulation.time_sec,
              payload.simulation.is_paused,
              payload.simulation.multiplier,
              payload.simulation.mode
            );
          }
        } catch (err) {
          console.warn("Erro ao desserializar telemetria no Cesium:", err);
        }
      };

      ws.onclose = () => {
        setTimeout(connectTelemetryWs, 2000);
      };

      ws.onerror = () => {
        try { ws.close(); } catch(e) {}
      };
    }

    async function initCesium() {
      const container = document.getElementById('cesiumContainer');
      if (!container) return;

      try {
        // Carrega a camada base NaturalEarthII compatível com Cesium 1.119+
        let baseLayer = false;
        try {
          const tmsProvider = await Cesium.TileMapServiceImageryProvider.fromUrl(
            Cesium.buildModuleUrl('Assets/Textures/NaturalEarthII')
          );
          baseLayer = new Cesium.ImageryLayer(tmsProvider);
        } catch (imageryErr) {
          console.warn("Aviso ao carregar camada NaturalEarthII, usando camada padrão:", imageryErr);
        }

        viewer = new Cesium.Viewer('cesiumContainer', {
          baseLayer: baseLayer,
          baseLayerPicker: false,
          geocoder: false,
          homeButton: false,
          sceneModePicker: true,
          navigationHelpButton: false,
          infoBox: true,
          selectionIndicator: true,
          animation: true,
          timeline: true,
          fullscreenButton: true,
          shouldAnimate: false // Inicialmente congelado até sincronizar com o Core
        });

        // Configurações Físicas e Atmosféricas
        viewer.scene.globe.enableLighting = true; // Iluminação solar realista
        viewer.scene.globe.atmosphereBrightnessShift = 0.1;
        viewer.scene.highDynamicRange = true;

        // Suprime o modal de interrupção em caso de erro transitório de frame
        viewer.scene.renderError.addEventListener((scene, error) => {
          console.warn("⚠️ Aviso de renderização Cesium (recuperado):", error);
        });

        // Carrega o documento CZML dinâmico gerado pelo backend
        Cesium.CzmlDataSource.load('/cesium/constellation.czml')
          .then(function(dataSource) {
            czmlSource = dataSource;
            if (viewer && !viewer.isDestroyed()) {
              viewer.dataSources.add(dataSource);
              if (lastTelemetryState) {
                syncCesiumClock(
                  lastTelemetryState.time_sec,
                  lastTelemetryState.is_paused,
                  lastTelemetryState.multiplier,
                  lastTelemetryState.mode
                );
              }
              focusConstellation();
            }
          })
          .catch(function(error) {
            console.error("Erro ao carregar CZML da constelação:", error);
          });

        // Inicia conexão WebSocket para escuta de telemetria
        connectTelemetryWs();

      } catch (err) {
        console.error("Erro na inicialização do Cesium Viewer:", err);
      }
    }

    // Funções de Câmera e Visualização
    function focusBrazil() {
      if (!viewer || viewer.isDestroyed()) return;
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(-50.0, -15.0, 12000000.0),
        orientation: {
          heading: Cesium.Math.toRadians(0.0),
          pitch: Cesium.Math.toRadians(-85.0),
          roll: 0.0
        },
        duration: 2.0
      });
    }

    function focusConstellation() {
      if (!viewer || viewer.isDestroyed()) return;
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(-48.0, -10.0, 75000000.0),
        orientation: {
          heading: Cesium.Math.toRadians(0.0),
          pitch: Cesium.Math.toRadians(-90.0),
          roll: 0.0
        },
        duration: 2.5
      });
    }

    function toggleOrbits() {
      if (!czmlSource) return;
      showPaths = !showPaths;
      const entities = czmlSource.entities.values;
      for (let i = 0; i < entities.length; i++) {
        if (entities[i].path) {
          entities[i].path.show = showPaths;
        }
      }
    }

    // Ouvintes de redimensionamento e sincronização com iframe pai
    window.addEventListener('resize', () => {
      if (viewer && !viewer.isDestroyed()) {
        viewer.resize();
      }
    });

    window.addEventListener('message', (event) => {
      if (event.data === 'resize' && viewer && !viewer.isDestroyed()) {
        viewer.resize();
      } else if (event.data && event.data.type === 'telemetry' && event.data.data) {
        const sim = event.data.data.simulation || event.data.data;
        if (sim && typeof sim.time_sec === 'number') {
          lastTelemetryState = sim;
          syncCesiumClock(sim.time_sec, sim.is_paused, sim.multiplier, sim.mode);
        }
      }
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initCesium);
    } else {
      initCesium();
    }
  </script>
</body>
</html>
